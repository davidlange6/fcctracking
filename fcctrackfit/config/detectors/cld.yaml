# CLD (all-silicon). Collection names checked against a CLDConfig (--truthTracking
# --trackingOnly) REC file from production/run_cld.sh. CellID encodings live under the
# sim-hit collection names.
name: CLD
bz: 2.0
mc_particles: MCParticles
# digitised hits -> (hit type, link collection to SimTrackerHits)
trackers:
  - {hits: VXDTrackerHits,        links: VXDTrackerHitRelations,             kind: si_plane, cellid_from: VertexBarrelCollection}
  - {hits: VXDEndcapTrackerHits,  links: VXDEndcapTrackerHitRelations,       kind: si_plane, cellid_from: VertexEndcapCollection}
  - {hits: ITrackerHits,          links: InnerTrackerBarrelHitsRelations,    kind: si_plane, cellid_from: InnerTrackerBarrelCollection}
  - {hits: ITrackerEndcapHits,    links: InnerTrackerEndcapHitsRelations,    kind: si_plane, cellid_from: InnerTrackerEndcapCollection}
  - {hits: OTrackerHits,          links: OuterTrackerBarrelHitsRelations,    kind: si_plane, cellid_from: OuterTrackerBarrelCollection}
  - {hits: OTrackerEndcapHits,    links: OuterTrackerEndcapHitsRelations,    kind: si_plane, cellid_from: OuterTrackerEndcapCollection}
# truth-seeded Kalman-filter baseline (Track collection with an AtIP TrackState)
kf_tracks: SiTracks_Refitted
selection:
  pdg: [13, -13]
  generator_status: [1]
  max_abs_cos_theta: 0.99
  min_hits: 6
  max_hits: 30
  drop_secondary_hits: true
# DD4hep system ids: 1/2 VXD barrel/endcap, 3/4 IT, 5/6 OT
seed:
  rule: spread
  systems: [1, 2, 3, 4, 5, 6]
  # end the outgoing arm where the turning angle estimated from the hit time exceeds this
  # (rad; loopers that turn between hits or revisit a layer)
  max_turn: 1.26
residual_scale_mm: 0.01
qop_eps: 0.02
