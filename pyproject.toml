[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fcctrackfit"
version = "0.1.0"
description = "Seed-guided bidirectional minGRU track fit on edm4hep data for FCC-ee detectors"
requires-python = ">=3.10"
dependencies = ["numpy", "torch", "h5py", "pyyaml", "matplotlib"]

[tool.setuptools.packages.find]
include = ["fcctrackfit*"]

[tool.setuptools.package-data]
fcctrackfit = ["config/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
